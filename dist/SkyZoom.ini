# SkyZoom configuration
# Edit and save, then restart the game to apply changes - or use the MCM
# menu (if SkyUI is installed), which edits this same file and applies
# changes immediately.

# Virtual-key code of the hold-to-zoom hotkey.
# Default is 5 (0x05), Mouse Button 4 / M4.
Hotkey=5

# XInput gamepad button bitmask that also holds-to-zoom (0 = disabled).
# Default is 4 (0x0004), D-Pad Left.
GamepadButton=4

# FOV in degrees while the hotkey is held.
ZoomFOV=60.0

# Exponential smoothing rate for the zoom-in/out animation.
# Higher = snappier, lower = more gradual.
SmoothSpeed=8.0
