# SkyZoom configuration
# Edit and save, then restart the game to apply changes.

# Keyboard/Mouse key used to activate zoom
# Default: 5 = Mouse Button 4 (M4)
Hotkey=5

# Gamepad button used to activate zoom (Xbox gamepads only)
# Default: 4 = D-Pad Left
# 0 = disabled
GamepadButton=4

# Zoom mode
# 0 = hold the button to zoom
# 1 = press once to zoom, press again to stop
ToggleMode=0

# FOV when zooming
# Lower number = more zoom
ZoomFOV=60.0

# Zoom speed
# Higher = faster zoom
SmoothSpeed=8.0

# Allows extra zoom to be changed with the mouse wheel or
# dedicated gamepad button
# 1 = enabled
# 0 = disabled
EnableScrollZoomAdjust=1

# Tightest zoom reachable with the mouse wheel or
# LiveZoomBoostButton below
# Lower number = more zoom
MinZoomFOV=20.0

# Uses SmoothSpeed for mouse wheel/gamepad live zoom adjust
# 1 = enabled
# 0 = disabled
ScrollUsesSmoothSpeed=0

# Gamepad button used for extra zoom
# Only works when Hotkey is held and EnableScrollZoomAdjust
# is enabled
# Default: 128 = Right Stick Button (RSB)
# 0 = disabled
LiveZoomBoostButton=128

# When GamepadButton is LT/RT, disables its normal
# function while zooming with the weapon sheathed
# 1 = enabled
# 0 = disabled
DisableTriggerWhenSheathed=0

# View where zoom works
# 0 = first person
# 1 = third person
# 2 = both
ViewMode=2

# Zoom only works when the weapon is sheathed
# 1 = yes
# 0 = zoom works at any time
RequireWeaponSheathed=1

# Allows zoom during NPC dialogue
# 1 = enabled
# 0 = disabled
AllowZoomDuringDialogue=0

# Reduces mouse and gamepad sensitivity while zoomed
# 1 = enabled
# 0 = disabled
ScaleMouseSensitivity=1

# Controls how much sensitivity is reduced
# Higher number = lower sensitivity while zoomed
SensitivityExponent=2.5
