# SkyZoom configuration
# Edit and save, then restart the game to apply changes - or use the MCM
# menu (if SkyUI is installed), which edits this same file and applies
# changes immediately.

# Virtual-key code of the hold-to-zoom hotkey.
# Default is 5 (0x05), Mouse Button 4 / M4.
Hotkey=5

# XInput gamepad button bitmask that also holds-to-zoom (0 = disabled).
# Default is 4 (0x0004), D-Pad Left.
GamepadButton=4

# FOV in degrees while the hotkey is held.
ZoomFOV=60.0

# Exponential smoothing rate for the zoom-in/out animation.
# Higher = snappier, lower = more gradual.
SmoothSpeed=8.0

# Which view(s) the hotkey zooms in. 0 = first person only, 1 = third person
# only, 2 = both (default).
ViewMode=2

# Whether to scale mouse sensitivity down while zoomed, so aim doesn't feel
# twitchy at a narrower FOV (1 = on, 0 = off).
ScaleMouseSensitivity=1

# How aggressively mouse sensitivity is cut while zoomed (only used
# while ScaleMouseSensitivity=1 above). 1.0 cuts it in direct proportion
# to the FOV ratio; higher values cut it more aggressively at moderate
# zoom without changing the no-zoom or fully-zoomed endpoints.
SensitivityExponent=2.5
